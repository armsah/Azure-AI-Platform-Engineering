trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.14"

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements-dev.txt
    workingDirectory: python/storage-demo
    displayName: Install dependencies

  - script: python -m compileall -q -x '(\.venv|\.git|\.terraform|__pycache__)' .
    workingDirectory: python/storage-demo
    displayName: Compile

  - script: python -m pytest -q
    workingDirectory: python/storage-demo
    displayName: Unit and AI tests

  - task: AzureCLI@2
    displayName: Verify Azure WIF authentication
    inputs:
      azureSubscription: azure-wif-ai-platform
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az account show --query "{subscription:name, tenant:tenantId, identity:user.name}" -o table
