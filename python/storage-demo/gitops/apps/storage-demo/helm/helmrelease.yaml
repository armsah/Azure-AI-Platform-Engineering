apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: storage-demo
  namespace: storage-demo
spec:
  interval: 5m

  chart:
    spec:
      chart: ./helm/storage-demo
      sourceRef:
        kind: GitRepository
        name: storage-demo-repo
        namespace: flux-system
      interval: 5m

  values:
    replicaCount: 2

    image:
      repository: acrarmenlearning2026.azurecr.io/storage-demo
      digest: "sha256:REPLACED_BY_CI"
