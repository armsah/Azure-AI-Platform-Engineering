name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python/storage-demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Azure login with OIDC
        if: github.event_name != 'pull_request' && vars.ENABLE_AZURE_OIDC_CI == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify federated Azure authentication
        if: github.event_name != 'pull_request' && vars.ENABLE_AZURE_OIDC_CI == 'true'
        run: |
          az account get-access-token --query "{expiresOn:expires_on}" -o table

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q -x '(\.venv|\.git|\.terraform|__pycache__)' .

      - name: Offline release and B10 readiness
        run: |
          python ../../scripts/validate_release.py
          python ../../scripts/validate_b10.py

      - name: Unit and AI tests
        run: python -m pytest -q
  node-api:
    name: Node.js API validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: services/node-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/node-api/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: TypeScript and HTTP contract tests
        run: npm run test:ci
