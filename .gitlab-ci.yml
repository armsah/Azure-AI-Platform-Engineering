stages:
  - test
  - auth

python-test:
  stage: test
  image: python:3.14-slim

  before_script:
    - cd python/storage-demo
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt

  script:
    - python -m compileall -q -x '(\.venv|\.git|\.terraform|__pycache__)' .
    - python -m pytest -q

azure-oidc:
  stage: auth
  image: mcr.microsoft.com/azure-cli:latest

  id_tokens:
    AZURE_OIDC_TOKEN:
      aud: api://AzureADTokenExchange

  script:
    - >
      az login
      --service-principal
      --username "$AZURE_CLIENT_ID"
      --tenant "$AZURE_TENANT_ID"
      --federated-token "$AZURE_OIDC_TOKEN"
      --allow-no-subscriptions
    - az account get-access-token --query "{expiresOn:expires_on}" -o table

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
