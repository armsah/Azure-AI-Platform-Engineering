apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: storage-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-helm-manager
  namespace: storage-demo
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-helm-manager
  namespace: storage-demo
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: storage-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-helm-manager
